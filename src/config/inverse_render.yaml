defaults:
  - latent: standalone
  - network: medium
  - scheduler: constant
  - _self_

train_dataset: ['matsynth8_train_dense_all','matsynth8_train_sparse_all']
val_dataset: ['matsynth8_test_dense_10','matsynth8_test_sparse_10']
tonemapped: srgb_no_clamp
num_workers: 8
n_iterations: 30000
batch_size: 1
checkpoint_count: 5

resolution: 1024
safe_tensors: false
checkpoint:
  network: null
  latent: null

disable_rep_images_loading: true

optimize: true
validation_video: True
training_video: True
shader_ball_video: False
use_offset: True
offset_video: ${use_offset}

use_hdf5: false
hdf5_data_root: /lustre/fsw/portfolios/nvr/users/shadadan/hd5_sep
hdf5_n_slices: 128

random_frame: False

latent:
  resolution: ${resolution}


lr:
  network: 0.001
  latent: 0.001

resume_path: null

scale_lr: false

trainable:
  network: true
  latent: true

mixed_precision: "no"

optimizer: Adam
max_grad_norm: null
grad_acc_steps: 1

seed: null
loss_func: L2
tv_loss: null
offset_lambda: 0.01

lpips:
  enabled: false
  weight: 0.1
  net: vgg
  only_lpips: false

jitter: true
spp: 4

date: ${now:%Y-%m-%d}
time: ${now:%H-%M-%S}

gradient_checkpointing: False
gradient_checkpointing_offload: False

dataset_names: ${train_dataset}
exp_name: ${latent.name}-res${resolution}-${dataset_names}-offset_${use_offset}-TM_${tonemapped}-net_l${latent.channels}-${network.width}x${network.depth}-bs${batch_size}

out_dir: ${time}-${exp_name}
out_root: ./outputs/${date}/${out_dir}

hydra:
  run:
    dir: ${out_root}