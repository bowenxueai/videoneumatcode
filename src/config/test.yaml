# NeuMIP Test Configuration

# Latent textures
latents_path: 'outputs/slurm/${folder}'
folder: null
dataset_name: null
traj: sparse
mlp_path: null
# name: stleather
latent_channels: 12
# folder: 1024x1024

materials_info:
  csv_path: data/diffusion/${dataset_name}/${traj}/metadata_clean.csv
  start: 0
  end: null
  every_other: 1
  specific_list: []
  exclude: null


# Network architecture
network_width: 64
network_depth: 4

# UV settings
uv_scale: 4
uv_shift: [0.08, 0.085]
zoomed_out: False

cam_loc: [-1, -3, 2]
init_lookat: [0,0,0]
lookat_r: 1.05
up: [0,0,1]
fov_max: 55
init_r: 4.8
fov_min: 40
envmap_rot: 90
envmap_rot_range: 120
cam_degree_rot: 10
mid_zoom_r: 1.8
cam_degree_rot_zoomout: 20
# Rendering settings
resolution: [1920, 1080]
use_coop: True
use_offset: True

# Animation
n_frames: 81
phase_frames: [30, 30, 30, 30, 30]
spp: 64

# Output options
video: True
key_frames: True
offset_video: ${use_offset}

# Output directory
out_dir: ${now:%H-%M-%S}-name_${dataset_name}_${traj}-offset_${use_offset}
out_root: ./outputs/${now:%Y-%m-%d}/${out_dir}

hydra:
  run:
    dir: ${out_root}
